name: Temporary format

on:
  push:
    branches:
      - audit/recruiter-ux-2026-09-26

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/recruiter-ux-2026-09-26

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - working-directory: ci
        run: npm ci

      - run: ./ci/node_modules/.bin/prettier --write "**/*.{html,css,js,json,md}"

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Aplicar formato Prettier tras QA"
          git push
