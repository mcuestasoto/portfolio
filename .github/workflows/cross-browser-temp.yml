name: Cross-browser QA

on:
  push:
    branches:
      - audit/recruiter-ux-2026-09-26

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          mkdir -p /tmp/cross-browser-qa
          cd /tmp/cross-browser-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/server.log
          exit 1

      - name: Run QA
        working-directory: /tmp/cross-browser-qa
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium, firefox, webkit } from "playwright";

          const engines = { chromium, firefox, webkit };
          const viewports = [
            {name:"1440x900",width:1440,height:900},
            {name:"1024x768",width:1024,height:768},
            {name:"768x1024",width:768,height:1024},
            {name:"390x844",width:390,height:844},
            {name:"320x568",width:320,height:568},
          ];
          const failures=[];

          for (const [engineName, engine] of Object.entries(engines)) {
            const browser=await engine.launch({headless:true});
            for (const vp of viewports) {
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              const page=await context.newPage();
              const errors=[];
              page.on("console",m=>{ if(m.type()==="error") errors.push("console: "+m.text()); });
              page.on("pageerror",e=>errors.push("pageerror: "+String(e)));
              const response=await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"networkidle"});
              await page.evaluate(()=>document.fonts.ready);
              const result=await page.evaluate(()=>({
                status: document.readyState,
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                h1: document.querySelectorAll("h1").length,
                manrope: document.fonts.check('16px "ManropeVariable"'),
                inter: document.fonts.check('16px "InterVariable"'),
                visibleMenuButton: getComputedStyle(document.querySelector(".mobile-menu-toggle")).display !== "none",
              }));
              if(response?.status()!==200 || result.overflow || result.h1!==1 || !result.manrope || !result.inter || errors.length){
                failures.push({engineName,viewport:vp.name,response:response?.status(),result,errors});
              }

              if(vp.width<=980){
                const toggle=page.locator(".mobile-menu-toggle");
                await toggle.focus();
                await page.keyboard.press("Enter");
                const opened=await page.evaluate(()=>({
                  expanded:document.querySelector(".mobile-menu-toggle").getAttribute("aria-expanded"),
                  hidden:document.querySelector(".mobile-menu").getAttribute("aria-hidden"),
                  pageInert:document.querySelector(".page-layout").inert,
                  focusText:document.activeElement?.textContent?.trim()
                }));
                await page.keyboard.press("Escape");
                const closed=await page.evaluate(()=>({
                  expanded:document.querySelector(".mobile-menu-toggle").getAttribute("aria-expanded"),
                  hidden:document.querySelector(".mobile-menu").getAttribute("aria-hidden"),
                  focusClass:document.activeElement?.className
                }));
                if(opened.expanded!=="true" || opened.hidden!=="false" || !opened.pageInert || closed.expanded!=="false" || closed.hidden!=="true"){
                  failures.push({engineName,viewport:vp.name,menu:{opened,closed}});
                }
              }
              await context.close();
            }

            // WCAG text-spacing stress test
            const context=await browser.newContext({viewport:{width:390,height:844}});
            const page=await context.newPage();
            await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"networkidle"});
            await page.addStyleTag({content:`
              * { line-height: 1.5 !important; letter-spacing: .12em !important; word-spacing: .16em !important; }
              p { margin-bottom: 2em !important; }
            `});
            const spacing=await page.evaluate(()=>({
              overflow:document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              clipped:[...document.querySelectorAll("p,h1,h2,h3,a,button")].filter(el=>el.scrollWidth>el.clientWidth+1 && getComputedStyle(el).overflow!=="visible").length
            }));
            if(spacing.overflow || spacing.clipped) failures.push({engineName,textSpacing:spacing});
            await context.close();
            await browser.close();
          }

          console.log(JSON.stringify({failures},null,2));
          if(failures.length) process.exit(2);
          EOF
          node qa.mjs
