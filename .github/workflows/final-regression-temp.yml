name: Final regression QA

on:
  push:
    branches:
      - audit/recruiter-ux-2026-09-26

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install QA tools
        run: |
          mkdir -p /tmp/portfolio-final-qa
          cd /tmp/portfolio-final-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright @axe-core/playwright lighthouse
          npx playwright install --with-deps chromium firefox webkit
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/server.log
          exit 1
      - name: Cross-browser responsive and accessibility
        working-directory: /tmp/portfolio-final-qa
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium, firefox, webkit } from "playwright";
          import AxeBuilder from "@axe-core/playwright";

          const engines={chromium,firefox,webkit};
          const viewports=[
            {name:"1440x900",width:1440,height:900},
            {name:"1024x768",width:1024,height:768},
            {name:"768x1024",width:768,height:1024},
            {name:"390x844",width:390,height:844},
            {name:"320x568",width:320,height:568},
          ];
          const failures=[];
          for(const [engineName,engine] of Object.entries(engines)){
            const browser=await engine.launch({headless:true});
            for(const vp of viewports){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},colorScheme:"light"});
              const page=await context.newPage();
              const errors=[];
              page.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
              page.on("pageerror",e=>errors.push(String(e)));
              const res=await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"networkidle"});
              await page.evaluate(()=>document.fonts.ready);
              const layout=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
                h1:document.querySelectorAll("h1").length,
                manrope:document.fonts.check('16px "ManropeVariable"'),
                inter:document.fonts.check('16px "InterVariable"'),
                undersized:[...document.querySelectorAll('a[href],button')].map(el=>{const r=el.getBoundingClientRect();const cs=getComputedStyle(el);return {text:(el.textContent||el.getAttribute("aria-label")||"").trim().replace(/\s+/g," ").slice(0,60),w:r.width,h:r.height,display:cs.display,visibility:cs.visibility}}).filter(x=>x.display!=="none"&&x.visibility!=="hidden"&&x.w>0&&x.h>0&&(x.w<24||x.h<24))
              }));
              if(res?.status()!==200||layout.overflow||layout.h1!==1||!layout.manrope||!layout.inter||layout.undersized.length||errors.length){
                failures.push({engineName,viewport:vp.name,status:res?.status(),layout,errors});
              }
              if(engineName==="chromium"){
                const axe=await new AxeBuilder({page}).withTags(["wcag2a","wcag2aa","wcag21a","wcag21aa","wcag22aa"]).analyze();
                if(axe.violations.length) failures.push({engineName,viewport:vp.name,axe:axe.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length}))});
              }
              if(vp.width<=980){
                const toggle=page.locator(".mobile-menu-toggle");
                await toggle.focus();
                await page.keyboard.press("Enter");
                const open=await page.evaluate(()=>({
                  expanded:document.querySelector(".mobile-menu-toggle")?.getAttribute("aria-expanded"),
                  hidden:document.querySelector(".mobile-menu")?.getAttribute("aria-hidden"),
                  inert:document.querySelector(".page-layout")?.inert
                }));
                await page.keyboard.press("Escape");
                const closed=await page.evaluate(()=>({
                  expanded:document.querySelector(".mobile-menu-toggle")?.getAttribute("aria-expanded"),
                  hidden:document.querySelector(".mobile-menu")?.getAttribute("aria-hidden")
                }));
                if(open.expanded!=="true"||open.hidden!=="false"||!open.inert||closed.expanded!=="false"||closed.hidden!=="true") failures.push({engineName,viewport:vp.name,menu:{open,closed}});
              }
              await context.close();
            }
            const context=await browser.newContext({viewport:{width:390,height:844},reducedMotion:"reduce"});
            const page=await context.newPage();
            await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"networkidle"});
            await page.addStyleTag({content:"*{line-height:1.5!important;letter-spacing:.12em!important;word-spacing:.16em!important}p{margin-bottom:2em!important}"});
            const stress=await page.evaluate(()=>({
              overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1,
              scrollBehavior:getComputedStyle(document.documentElement).scrollBehavior
            }));
            if(stress.overflow||stress.scrollBehavior!=="auto") failures.push({engineName,stress});
            await context.close();
            await browser.close();
          }
          console.log(JSON.stringify({failures},null,2));
          if(failures.length) process.exit(2);
          EOF
          node qa.mjs
      - name: Lighthouse mobile
        working-directory: /tmp/portfolio-final-qa
        run: |
          npx lighthouse http://127.0.0.1:4173/index.html --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=lh.json --quiet
          node -e 'const r=require("./lh.json"); const x={performance:r.categories.performance.score,accessibility:r.categories.accessibility.score,bestPractices:r.categories["best-practices"].score,seo:r.categories.seo.score,lcp:r.audits["largest-contentful-paint"].numericValue,cls:r.audits["cumulative-layout-shift"].numericValue,tbt:r.audits["total-blocking-time"].numericValue}; console.log(JSON.stringify(x)); if(x.accessibility<1||x.bestPractices<1||x.seo<1||x.performance<0.95) process.exit(2)'
