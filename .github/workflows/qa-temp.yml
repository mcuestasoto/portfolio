name: QA portfolio

on:
  push:
    branches:
      - audit/recruiter-ux-2026-09-26

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install QA tools
        run: |
          mkdir -p /tmp/portfolio-qa
          cd /tmp/portfolio-qa
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright @axe-core/playwright lighthouse
          npx playwright install chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Run responsive, usability and accessibility QA
        working-directory: /tmp/portfolio-qa
        run: |
          cat > qa.mjs <<'EOF'
          import fs from "node:fs";
          import { chromium } from "playwright";
          import AxeBuilder from "@axe-core/playwright";

          const base = "http://127.0.0.1:4173";
          const viewports = [
            { name: "1440x900", width: 1440, height: 900 },
            { name: "1366x768", width: 1366, height: 768 },
            { name: "1280x720", width: 1280, height: 720 },
            { name: "1024x768", width: 1024, height: 768 },
            { name: "768x1024", width: 768, height: 1024 },
            { name: "430x932", width: 430, height: 932 },
            { name: "390x844", width: 390, height: 844 },
            { name: "320x568", width: 320, height: 568 },
          ];

          const browser = await chromium.launch({ headless: true });
          const results = [];
          const globalConsoleErrors = [];
          const pageErrors = [];

          for (const vp of viewports) {
            const context = await browser.newContext({
              viewport: { width: vp.width, height: vp.height },
              colorScheme: "light",
            });
            const page = await context.newPage();
            page.on("console", msg => {
              if (msg.type() === "error") globalConsoleErrors.push({ viewport: vp.name, text: msg.text() });
            });
            page.on("pageerror", err => pageErrors.push({ viewport: vp.name, text: String(err) }));

            const response = await page.goto(base + "/index.html", { waitUntil: "networkidle" });
            await page.evaluate(() => document.fonts.ready);

            const layout = await page.evaluate(() => {
              const root = document.documentElement;
              const body = document.body;
              const interactives = [...document.querySelectorAll('a[href], button, [role="button"], input, select, textarea')];
              const visible = interactives
                .map(el => {
                  const r = el.getBoundingClientRect();
                  const cs = getComputedStyle(el);
                  return {
                    tag: el.tagName,
                    text: (el.textContent || el.getAttribute("aria-label") || "").trim().replace(/\s+/g, " ").slice(0, 80),
                    href: el.getAttribute("href"),
                    width: Math.round(r.width * 10) / 10,
                    height: Math.round(r.height * 10) / 10,
                    display: cs.display,
                    visibility: cs.visibility,
                    opacity: cs.opacity,
                    inViewport: r.bottom > 0 && r.right > 0 && r.left < innerWidth && r.top < innerHeight,
                  };
                })
                .filter(x => x.display !== "none" && x.visibility !== "hidden" && x.opacity !== "0" && x.width > 0 && x.height > 0);

              const undersized = visible.filter(x => x.width < 24 || x.height < 24);

              const headings = [...document.querySelectorAll("h1,h2,h3")].map(el => ({
                level: Number(el.tagName.slice(1)),
                text: el.textContent.trim().replace(/\s+/g, " "),
              }));

              return {
                viewport: { width: innerWidth, height: innerHeight },
                scrollWidth: root.scrollWidth,
                clientWidth: root.clientWidth,
                bodyScrollWidth: body.scrollWidth,
                horizontalOverflow: root.scrollWidth > root.clientWidth + 1,
                undersized,
                headings,
                h1Count: document.querySelectorAll("h1").length,
                mainCount: document.querySelectorAll("main").length,
                navCount: document.querySelectorAll("nav").length,
              };
            });

            const axe = await new AxeBuilder({ page })
              .withTags(["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"])
              .analyze();

            fs.mkdirSync("screenshots", { recursive: true });
            await page.screenshot({ path: `screenshots/${vp.name}.png`, fullPage: true });

            results.push({
              viewport: vp.name,
              status: response?.status(),
              layout,
              axeViolations: axe.violations.map(v => ({
                id: v.id,
                impact: v.impact,
                help: v.help,
                nodes: v.nodes.length,
                targets: v.nodes.map(n => n.target),
              })),
            });

            await context.close();
          }

          // Mobile menu keyboard/focus behavior
          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const mp = await mobile.newPage();
          await mp.goto(base + "/index.html", { waitUntil: "networkidle" });
          await mp.keyboard.press("Tab");
          const firstFocus = await mp.evaluate(() => ({
            text: document.activeElement?.textContent?.trim(),
            className: document.activeElement?.className,
          }));
          const menuButton = mp.locator(".mobile-menu-toggle");
          await menuButton.focus();
          await mp.keyboard.press("Enter");
          await mp.waitForTimeout(50);
          const opened = await mp.evaluate(() => ({
            expanded: document.querySelector(".mobile-menu-toggle")?.getAttribute("aria-expanded"),
            menuHidden: document.querySelector(".mobile-menu")?.getAttribute("aria-hidden"),
            focusedText: document.activeElement?.textContent?.trim(),
            pageInert: document.querySelector(".page-layout")?.inert,
          }));
          await mp.keyboard.press("Escape");
          await mp.waitForTimeout(50);
          const closed = await mp.evaluate(() => ({
            expanded: document.querySelector(".mobile-menu-toggle")?.getAttribute("aria-expanded"),
            menuHidden: document.querySelector(".mobile-menu")?.getAttribute("aria-hidden"),
            focusClass: document.activeElement?.className,
            pageInert: document.querySelector(".page-layout")?.inert,
          }));
          await mobile.close();

          // Reduced motion
          const reduced = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            reducedMotion: "reduce",
          });
          const rp = await reduced.newPage();
          await rp.goto(base + "/index.html", { waitUntil: "networkidle" });
          const reducedMotion = await rp.evaluate(() => ({
            htmlScrollBehavior: getComputedStyle(document.documentElement).scrollBehavior,
            buttonTransition: getComputedStyle(document.querySelector(".button")).transitionDuration,
          }));
          await reduced.close();

          // Local resource audit.
          const resourceContext = await browser.newContext();
          const resourcePage = await resourceContext.newPage();
          const resourceFailures = [];
          resourcePage.on("response", res => {
            const url = res.url();
            if (url.startsWith(base) && res.status() >= 400) resourceFailures.push({ url, status: res.status() });
          });
          await resourcePage.goto(base + "/index.html", { waitUntil: "networkidle" });
          const localRefs = await resourcePage.evaluate(() => {
            const attrs = [
              ...[...document.querySelectorAll("link[href]")].map(el => el.href),
              ...[...document.querySelectorAll("script[src]")].map(el => el.src),
              ...[...document.querySelectorAll("img[src]")].map(el => el.src),
            ];
            return [...new Set(attrs.filter(Boolean))];
          });
          const localChecks = [];
          for (const url of localRefs.filter(u => u.startsWith(base))) {
            const res = await resourceContext.request.get(url);
            localChecks.push({ url, status: res.status() });
          }
          await resourceContext.close();

          const output = {
            generatedAt: new Date().toISOString(),
            results,
            keyboard: { firstFocus, opened, closed },
            reducedMotion,
            consoleErrors: globalConsoleErrors,
            pageErrors,
            resourceFailures,
            localChecks,
          };

          fs.writeFileSync("qa-results.json", JSON.stringify(output, null, 2));

          const violationCount = results.reduce((n, r) => n + r.axeViolations.length, 0);
          const overflow = results.filter(r => r.layout.horizontalOverflow).map(r => r.viewport);
          const undersized = results.map(r => ({
            viewport: r.viewport,
            count: r.layout.undersized.length,
            items: r.layout.undersized,
          })).filter(x => x.count);

          console.log("QA_SUMMARY=" + JSON.stringify({
            axeViolationGroups: violationCount,
            overflow,
            undersized,
            keyboard: output.keyboard,
            reducedMotion,
            consoleErrors: globalConsoleErrors,
            pageErrors,
            brokenLocalResources: localChecks.filter(x => x.status >= 400),
          }));

          if (violationCount || overflow.length || globalConsoleErrors.length || pageErrors.length || localChecks.some(x => x.status >= 400)) {
            process.exitCode = 2;
          }

          await browser.close();
          EOF
          node qa.mjs

      - name: Run Lighthouse mobile
        if: always()
        working-directory: /tmp/portfolio-qa
        run: |
          npx lighthouse http://127.0.0.1:4173/index.html             --chrome-flags="--headless --no-sandbox"             --only-categories=performance,accessibility,best-practices,seo             --output=json --output-path=lighthouse-mobile.json             --quiet || true
          node -e 'const r=require("./lighthouse-mobile.json"); console.log("LIGHTHOUSE_MOBILE="+JSON.stringify({performance:r.categories.performance.score,accessibility:r.categories.accessibility.score,bestPractices:r.categories["best-practices"].score,seo:r.categories.seo.score,lcp:r.audits["largest-contentful-paint"].numericValue,cls:r.audits["cumulative-layout-shift"].numericValue,tbt:r.audits["total-blocking-time"].numericValue}))'

      - name: Run Lighthouse desktop
        if: always()
        working-directory: /tmp/portfolio-qa
        run: |
          npx lighthouse http://127.0.0.1:4173/index.html             --preset=desktop             --chrome-flags="--headless --no-sandbox"             --only-categories=performance,accessibility,best-practices,seo             --output=json --output-path=lighthouse-desktop.json             --quiet || true
          node -e 'const r=require("./lighthouse-desktop.json"); console.log("LIGHTHOUSE_DESKTOP="+JSON.stringify({performance:r.categories.performance.score,accessibility:r.categories.accessibility.score,bestPractices:r.categories["best-practices"].score,seo:r.categories.seo.score,lcp:r.audits["largest-contentful-paint"].numericValue,cls:r.audits["cumulative-layout-shift"].numericValue,tbt:r.audits["total-blocking-time"].numericValue}))'

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: |
            /tmp/portfolio-qa/qa-results.json
            /tmp/portfolio-qa/lighthouse-mobile.json
            /tmp/portfolio-qa/lighthouse-desktop.json
            /tmp/portfolio-qa/screenshots
          if-no-files-found: warn
