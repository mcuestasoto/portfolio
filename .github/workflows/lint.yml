name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - working-directory: ci
        run: npm ci

      - run: |
          ./ci/node_modules/.bin/prettier --write "**/*.{html,css,js,json,md}"
          git diff -- cv.html
          git diff --exit-code

      - run: ./ci/node_modules/.bin/html-validate --config .htmlvalidate.json index.html cv.html 404.html
