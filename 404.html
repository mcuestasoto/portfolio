<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Página no encontrada · Mercedes Cuesta</title>
    <meta
      name="description"
      content="La página que buscas no existe o se ha movido. Vuelve al portfolio de Mercedes Cuesta."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F7F8FC" />
    <meta name="color-scheme" content="light" />

    <link
      rel="icon"
      href="assets/img/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link
      rel="icon"
      href="assets/img/icon-512.png"
      type="image/png"
      sizes="512x512"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/img/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="error-page">
    <div>
      <p class="error-page__eyebrow">Error 404</p>
      <h1 class="error-page__title">Esta página no existe</h1>
      <p class="error-page__text">
        Puede que el enlace esté mal escrito o que la página se haya movido.
      </p>

      <a href="/" class="button button--secondary"> Volver al portfolio </a>
    </div>
  </body>
</html>
